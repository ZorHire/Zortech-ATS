events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile     on;
    keepalive_timeout  65;

    # Allow up to 25 MB uploads (resume files, attachments)
    client_max_body_size 25m;

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name zorhire.zortechs.in;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS ─────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name zorhire.zortechs.in;

        ssl_certificate     /etc/letsencrypt/live/zorhire.zortechs.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/zorhire.zortechs.in/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # ── Backend API ───────────────────────────────────────────────────────
        location /v1/ {
            proxy_pass         http://backend:8080/v1/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ── Frontend SPA (static files) ───────────────────────────────────────
        # Populated by deploy-all.ps1 (manual) or CI/CD.
        # Falls back to /index.html for client-side routing.
        root  /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
