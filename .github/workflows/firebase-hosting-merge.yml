# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Frontend ────────────────────────────────────────────────────────────
      - name: Build frontend
        run: cd frontend && npm install && npm run build

      - name: Deploy frontend to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZORTECH_SOLUTIONS_51A8D }}
          channelId: live
          projectId: zortech-solutions-51a8d

      # ── Backend ─────────────────────────────────────────────────────────────
      - name: Upload frontend dist to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "frontend/dist"
          target: /opt/zortech
          strip_components: 0

      - name: Upload backend source to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "backend/src,backend/package.json,backend/package-lock.json,backend/tsconfig.json,backend/Dockerfile,backend/start.sh"
          target: /opt/zortech/backend
          strip_components: 1

      - name: Upload infrastructure files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,nginx,vps-setup.sh,rollback.sh"
          target: /opt/zortech
          strip_components: 0

      - name: Rebuild backend and run migrations
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/zortech
            docker compose build backend
            docker compose up -d
            echo "Waiting for backend to be ready (migrations run on startup)..."
            for i in $(seq 1 36); do
              if docker compose exec -T backend node -e \
                "require('http').get('http://localhost:8080/v1/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))" \
                > /dev/null 2>&1; then
                echo "Backend ready after $(( i * 5 ))s"
                exit 0
              fi
              echo "  [${i}/36] Not ready yet ($(( i * 5 ))s elapsed)..."
              sleep 5
            done
            echo "ERROR: Backend did not respond within 180s. Last 60 log lines:"
            docker compose logs --tail=60 backend
            exit 1

      # ── Health check ────────────────────────────────────────────────────────
      - name: Backend health check
        run: |
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://zorhire.zortechs.in/v1/health)
            if [ "$STATUS" = "200" ]; then
              echo "Backend healthy (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: got HTTP $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "ERROR: Backend health check failed after 3 attempts"
          exit 1
