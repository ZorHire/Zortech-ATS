name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
      - 'feature-*'
      - 'feat/**'
      - 'fix/**'
      - 'hotfix/**'

jobs:
  # ── Detect which parts of the codebase changed ──────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
              - 'docker-compose.yml'
              - 'nginx/**'
              - 'vps-setup.sh'
              - 'rollback.sh'

  # ── TypeScript validation — gate for all deploys ─────────────────────────────
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache backend dependencies
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: backend-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: backend-

      - name: Cache frontend dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: frontend-

      - name: Install backend dependencies
        run: cd backend && npm install

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Type check backend
        run: cd backend && npx tsc --noEmit

      - name: Type check frontend
        run: cd frontend && npx tsc --noEmit

  # ── Frontend build + deploy ──────────────────────────────────────────────────
  deploy_frontend:
    needs: [validate, changes]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache frontend dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: frontend-

      - name: Build frontend
        run: cd frontend && npm install && npm run build

      - name: Deploy frontend to Firebase
        if: github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZORTECH_SOLUTIONS_51A8D }}
          channelId: live
          projectId: zortech-solutions-51a8d

      - name: Upload frontend dist to VPS
        if: github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "frontend/dist"
          target: /opt/zortech
          strip_components: 0

  # ── Backend deploy ───────────────────────────────────────────────────────────
  deploy_backend:
    needs: [validate, changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload backend source to VPS
        if: github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "backend/src,backend/package.json,backend/package-lock.json,backend/tsconfig.json,backend/Dockerfile,backend/start.sh"
          target: /opt/zortech/backend
          strip_components: 1

      - name: Upload infrastructure files to VPS
        if: github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,nginx,vps-setup.sh,rollback.sh"
          target: /opt/zortech
          strip_components: 0

      - name: Rebuild backend, run migrations, verify health
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/zortech
            docker compose build backend
            docker compose up -d
            echo "Waiting for backend to be ready (migrations run on startup)..."
            for i in $(seq 1 36); do
              # timeout 10: kills docker exec if it hangs (e.g. server accepts TCP but never responds)
              # req.setTimeout inside the script: aborts the HTTP request after 5s so node exits cleanly
              if timeout 10 docker compose exec -T backend node -e \
                "const r=require('http').get('http://localhost:8080/v1/health',res=>{process.exit(res.statusCode===200?0:1)});r.setTimeout(5000,()=>{r.destroy();process.exit(1)});r.on('error',()=>process.exit(1))" \
                > /dev/null 2>&1; then
                echo "Backend ready after $(( i * 5 ))s"
                exit 0
              fi
              echo "  [${i}/36] Not ready yet ($(( i * 5 ))s elapsed)..."
              sleep 5
            done
            echo "Health check failed after 3 minutes — rolling back to previous image..."
            docker compose logs backend --tail=50 || true
            bash /opt/zortech/rollback.sh
            exit 1

      - name: Verify backend via public URL
        if: github.ref == 'refs/heads/main'
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -sf --max-time 15 -o /dev/null -w "%{http_code}" https://zorhire.zortechs.in/v1/health 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Backend healthy via public URL (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i/5: got HTTP $STATUS, retrying in 15s..."
            sleep 15
          done
          echo "ERROR: Public URL health check failed after 5 attempts"
          exit 1
